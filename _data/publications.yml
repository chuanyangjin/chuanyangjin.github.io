- id: into-the-unknown
  selected: false
  title: "Into the Unknown: Benchmarking AI Agents on Open Scientific Research Problems"
  authors: 'Seungone Kim, Jiayi Geng, Young-Jun Lee, Bo Liu, Juyoung Suk, Nicholas Lubbers, Mitchell Wood, Marcus Noack, Yong-Xin Yao, Yuan Shi, Roxana Bujack, Cristina Garcia Cardona, Austin Rodriguez, Ilon Joseph, Woojin Cho, Zora Zhiruo Wang, <b>Chuanyang Jin</b>, Ian Wu, Apurva Gandhi, Tianjian Li, Weiwei Sun, Carolin Lawrence, Kiril Gashteovski, Dongyeop Kang, Jay Shin, Akari Asai, Graham Neubig, Sean Welleck'
  venue: 'arXiv preprint'
  intro: >
    We introduce <i>Into the Unknown</i>, a benchmark that gives an agent a science paper and an unpublished follow-up direction from scientists at DOE national laboratories, and asks it to write the follow-up paper.
    Across nine frontier agents, none of the 135 submissions meets all of the scientists’ conditions, and 114 fail our integrity check, often by claiming work that was never done.
  links:
