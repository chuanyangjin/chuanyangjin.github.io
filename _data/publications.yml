- id: autotom
  selected: true
  title: "AutoToM: Scaling Model-based Mental Inference via Automated Agent Modeling"
  authors: '<b>Chuanyang Jin</b>*†, Zhining Zhang*, Mung Yao Jia*, Shunchi Zhang*, Tianmin Shu'
  venue: 'NeurIPS 2025 <span class="award">Spotlight</span> / 📰 Featured in Synced'
  intro: >
    <i>AutoToM</i> is an automated agent modeling method for scalable, robust, and interpretable mental inference.
    Given a ToM problem, <i>AutoToM</i> proposes a minimal agent model, performs Bayesian inverse planning based on the model, and iteratively refines the model until it can confidently infer the target mental state.
    It achieves SOTA on five benchmarks, produces human-like confidence estimates, and supports embodied decision-making.
  links:
