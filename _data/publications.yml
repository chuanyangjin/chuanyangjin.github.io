    - label: Unslopping AI blog
      url: https://facebookresearch.github.io/RAM/blogs/unslop/
    - label: tweet
      url: https://x.com/jaseweston/status/2115992445930311714

- id: ideascientist
  selected: false
  title: "IdeaScientist: Orchestrating Agents for Grounded Scientific Ideation"
  authors: 'Jiarui Liu, Renjie Tao, Yiwei Liao, <b>Chuanyang Jin</b>, Kai Sun, Xiao Yang, Xinyuan Zhang, Xilun Chen, Zhuangqun Huang, Lechen Zhang, Yongjin Yang, Yinghui He, Weihao Xuan, Rakesh Wanga, Anuj Kumar, Mona T. Diab, Wen-tau Yih, Xin Luna Dong'
  venue: 'arXiv preprint'
  intro: >
    We introduce <i>IdeaScientist</i>, which splits research ideation into gap finding, innovation, and report writing, trains each role with reinforcement learning,
    and draws solutions from analogous problems across fields using the 2.77M-idea Svalbard Idea Vault.
    On a 27B open model, it beats the strongest open-source autoresearch baseline by 14.0% and even outperforms Claude Code and Codex agents by up to 5.9%.
  links:
