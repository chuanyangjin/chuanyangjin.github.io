- id: videoresearcher
  selected: false
  title: "VideoResearcher: Self-Improving Tool Design for Long-Video Understanding"
  authors: 'Dingqiang Ye*, Dongdi Zhao*, Kaishen Wang, Qingqiao Hu, Jingchen Sun, Yijun Liang, Yuqi Jia, Yiqiao Huang, Yunjie Tian, Jiaxing Zhang, <b>Chuanyang Jin</b>, Ke Zhang, Vishal M. Patel, Di Fu'
  venue: 'arXiv preprint'
  intro: >
    We introduce <i>VideoResearcher</i>, a training-free multi-agent framework that, like a human researcher, autonomously designs, tests, and refines tools for long-video understanding.
    By evolving its tools from its own tool-use trajectories, it achieves state-of-the-art results among self-improving video agents and approaches the human-designed upper bound.
  links:
    - label: paper
      url: https://arxiv.org/abs/2609.19664

- id: ai-observatory
  selected: false
  title: "The AI Observatory: A Public Measure of Real-World AI Use"
  authors: 'Shayne Longpre*, Anka Reuel*, Dayeon Ki*, Cathy Mengying Fang*, Megan Richards*, Zhiping Zhang*, <b>Chuanyang Jin</b>*, Jenn Mickel, Cedric Deslandes Whitney, Ahmet Üstün, Niloofar Mireshghallah, Victor Ojewale, Ariel Lee, Alex (Sandy) Pentland, Tianshi Li, Yuntian Deng, Mykel Kochenderfer, Sara Hooker, Sanmi Koyejo'
  venue: 'NeurIPS 2026 / 📰 Featured in the Washington Post and MIT Tech Review'
  intro: >
    We introduce the <i>AI Observatory</i>, a public measurement platform that aggregates the most comprehensive set of real AI conversation sources under a common taxonomy of 145 features,
    spanning function, topic, sensitive use, interaction style, multi-turn dynamics, and conversation structure.
    Across 23,158 conversations and 85,633 turns, we find that observed AI use is highly heterogeneous with no single source that generalizes,
    and that occupation-focused analyses omit substantial personal, social, cultural, and safety-relevant interaction.
  links:
    - label: paper
      url: https://www.dataprovenance.org/ai_observatory.pdf
    - label: project
      url: https://ai-observatory.org

- id: selfcompact
  selected: false
  title: "Self-Compacting Language Model Agents"
  authors: 'Tianjian Li, Jingyu Zhang, William Jurayj, Xi Wang, <b>Chuanyang Jin</b>, Mehrdad Farajtabar, Eric Nalisnick, Daniel Khashabi'
  venue: 'NeurIPS 2026 / 🔍 Invited Talks at Google, Apple, and Rice University'
  intro: >
    We let the model itself decide when and how to compact its own context, pairing a compaction tool with a lightweight rubric for when to fire and when to hold off. 
    This self-compaction matches or beats fixed-interval summarization while using 30-70% less context budget.
