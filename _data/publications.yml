- id: aligning-autoresearch
  selected: true
  title: "Aligning Autoresearch: Co-Improvement between Agents and Humans"
  authors: '<b>Chuanyang Jin</b>*, Tianjian Li*, Seungone Kim*, Tong Chen, John Hoffman, Yoram Bachrach, Pedro Rodriguez, Ping Yu, Eryk Helenowski, Swarnadeep Saha, Jack Lanchantin, Weizhe Yuan, Ilia Kulikov, Jason Weston'
  venue: '<img src="/assets/img/logos/meta-logo.svg" alt="Meta" style="height: 0.95em; display: inline; vertical-align: -0.12em; margin-right: 3px;">Technical Report'
  intro: >
    While the AI community races toward RSI, we're exploring an alternative path: recursive human–AI co-improvement.
    We find that humans still play a pivotal role in directing agents, especially in ideation, and introduce <i>HackBench</i>, which shows that current agents cannot sufficiently localize reward hacks.
    We then train agents to interact with humans by using human simulators during RL, and improve how agents communicate through RL with rubrics aligned with human experts.
  links:
    - label: paper
      url: https://arxiv.org/abs/2610.38882
    - label: AutoBenchmark blog
