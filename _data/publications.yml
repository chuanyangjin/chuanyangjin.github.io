- id: autobenchmark
  selected: false
  title: "AutoBenchmark: Benchmark Creation and the Role of Humans"
  authors: 'Seungone Kim, <b>Chuanyang Jin</b>, Tianjian Li, Chenxi Whitehouse, Jason Weston, Weizhe Yuan, Ilia Kulikov, Swarnadeep Saha, Jack Lanchantin'
  venue: '<img src="/assets/img/logos/meta-logo.svg" alt="Meta" style="height: 0.95em; display: inline; vertical-align: -0.12em; margin-right: 3px;">Technical Blog'
  intro: >
    We introduce <i>AutoBenchmark</i>, in which an autoresearch agent builds a benchmark end to end and revises it using solver results and verifier critiques, and we study how much human AI scientists help.
    Unaided agents produce near-saturated benchmarks, while detailed human direction on what and how to build halves solver scores, showing that humans are still needed in benchmark creation.
  links:
