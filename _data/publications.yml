- id: rlhi
  selected: true
  title: "The Era of Real-World Human Interaction: RL from User Conversations"
  authors: '<b>Chuanyang Jin</b>, Jing Xu, Bo Liu, Leitian Tao, Olga Golovneva, Tianmin Shu, Wenting Zhao, Xian Li, Jason Weston'
  venue: '<img src="/assets/img/logos/meta-logo.svg" alt="Meta" style="height: 0.95em; display: inline; vertical-align: -0.12em; margin-right: 3px;">Technical Report / 🔍 Invited Talk at Meta TBD Lab, Google Research, WashU, Northwestern and UW / ⭐️ Paper of the Week by Huggingface, DAIR.AI, and TuringPost'
  intro: >
    We posit that to achieve continual model improvement and multifaceted alignment, future models must learn from natural human interaction.
    We introduce Reinforcement Learning from Human Interaction (RLHI), a paradigm that learns directly from in-the-wild user conversations, leveraging organic replies and long-term history as learning signals.
    Trained on WildChat, RLHI outperforms RLHF in personalization and instruction-following, and similar feedback enhances performance on reasoning benchmarks.
  links:
    - label: paper
      url: https://arxiv.org/abs/2509.25137
    - label: tweet
