- id: thoughttrace
  selected: true
  title: "ThoughtTrace: Understanding User Thoughts in Real-World LLM Interactions"
  authors: '<b>Chuanyang Jin</b>, Binze Li, Haopeng Xie, Cathy Mengying Fang, Tianjian Li, Shayne Longpre, Hongxiang Gu, Maximillian Chen, Tianmin Shu'
  venue: 'Tech Report / ⭐️ Paper of the Week by Huggingface /  📰 Featured in Synced'
  intro: >
    We introduce <i>ThoughtTrace</i>, the first large-scale dataset that pairs real-world multi-turn human-AI conversations with users' self-reported thoughts.
    Our analysis shows that these thoughts are distinct from messages, difficult for frontier LLMs to infer, and provide actionable signals for user-behavior prediction and model alignment, 
    opening new directions for user modeling, model training, and evaluation.
  links:
    - label: paper
      url: https://arxiv.org/abs/2605.20087
    - label: project
      url: https://thoughttrace-project.github.io
    - label: data
      url: https://huggingface.co/datasets/SCAI-JHU/ThoughtTrace
    - label: code
      url: https://github.com/thoughttrace-project/ThoughtTrace
    - label: tweet
      url: https://x.com/chuanyang_jin/status/2057111965101670842?s=20
    - label: Synced news
      url: https://mp.weixin.qq.com/s/fxYJRiIsVNbVHO3HMZ9TEQ

- id: rlhi
  selected: true
  title: "The Era of Real-World Human Interaction: RL from User Conversations"
  authors: '<b>Chuanyang Jin</b>, Jing Xu, Bo Liu, Leitian Tao, Olga Golovneva, Tianmin Shu, Wenting Zhao, Xian Li, Jason Weston'
  venue: 'Tech Report / 🔍  Invited Talk at Google DeepMind, Meta TBD Lab / ⭐️ Paper of the Week by Huggingface, DAIR.AI, TuringPost'
  intro: >
    We posit that to achieve continual model improvement and multifaceted alignment, future models must learn from natural human interaction.
    We introduce Reinforcement Learning from Human Interaction (RLHI), a paradigm that learns directly from in-the-wild user conversations, leveraging organic replies and long-term history as learning signals.
    Trained on WildChat, RLHI outperforms RLHF in personalization and instruction-following, and similar feedback enhances performance on reasoning benchmarks.
  links:
    - label: paper
      url: https://arxiv.org/abs/2509.25137
    - label: tweet
      url: https://x.com/jaseweston/status/1972851921255051489
    - label: slides
      url: https://docs.google.com/presentation/d/1bJHKHFH3eS-vvWcu-vpTT-Zm3Od6p2Cg0wI-qnwEO-4/edit?usp=sharing

- id: spice
  selected: true
  title: "SPICE: Self-Play In Corpus Environments Improves Reasoning"
  authors: 'Bo Liu, <b>Chuanyang Jin</b>, Seungone Kim, Weizhe Yuan, Wenting Zhao, Ilia Kulikov, Xian Li, Sainbayar Sukhbaatar, Jack Lanchantin, Jason Weston'
  venue: 'Tech Report /  📰 Featured in VentureBeat'
  intro: >
    SPICE is a reinforcement learning framework where a single model improves itself by playing two roles: a Challenger that creates tasks based on corpora, and a Reasoner that solves them.
    By grounding this self-play in corpora, SPICE addresses hallucination and lack of diversity issues, significantly outperforming standard (ungrounded) self-play across reasoning benchmarks.
  links:
    - label: paper
      url: https://arxiv.org/abs/2510.24684
    - label: tweet
      url: https://x.com/jaseweston/status/1983343787465150814
    - label: VentureBeat news
      url: https://venturebeat.com/ai/metas-spice-framework-lets-ai-systems-teach-themselves-to-reason

- id: mindzero
  selected: true
  title: "MindZero: Learning Online Mental Reasoning With Zero Annotations"
  authors: 'Shunchi Zhang*, Jin Lu*, <b>Chuanyang Jin</b>*, Yichao Zhou*, Zhining Zhang, Tianmin Shu'
  venue: 'ICML 2026 / HCAIR@ICLR 2026 <span class="red"><b>(Oral)</b></span>'
  intro: >
    We introduce <i>MindZero</i>, a self-supervised reinforcement learning framework that trains multimodal LLMs for efficient and robust online Theory-of-Mind reasoning.
    During training, the model is rewarded for generating mental state hypotheses that best explain observed human actions.
    Across four experimental settings, <i>MindZero</i> significantly outperforms LLMs and model-based methods in accuracy and efficiency.
  links:
    - label: paper
      url: https://openreview.net/pdf?id=0xDjjEfz6T
    - label: project
      url: https://mindzero.github.io/
    - label: code
      url: https://github.com/SCAI-JHU/MindZero

