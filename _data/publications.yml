- id: hypertrace
  selected: false
  title: "HyperTrace: Hypothesis-Based Preference Tracing for Online LLM Personalization"
  authors: 'Jianzhi Shen*, Keyu Mao*, Minghao Shao, <b>Chuanyang Jin</b>, Yusong Wang, Ailiang Lin, Kotaro Funakoshi, Manabu Okumura, Tianmin Shu, Muhammad Shafique'
  venue: 'EMNLP 2026 Findings'
  intro: >
    We introduce <i>HyperTrace</i>, a training-free framework that treats online personalization as tracing a user’s latent preferences: it keeps interpretable natural-language hypotheses about short-term intent and long-term preferences and updates them across turns and sessions.
    On PRISM and PersonaMem-v2, it improves response alignment, preference prediction, and profile consistency over strong online baselines.
  links:
