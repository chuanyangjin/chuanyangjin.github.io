- id: rna-speckles
  selected: false
  title: "Dynamics of RNA Localization to Nuclear Speckles are Connected to Splicing Efficiency"
  authors: 'Jinjun Wu*, Yu Xiao*, Yunzheng Liu*, Li Wen, <b>Chuanyang Jin</b>, Shun Liu, Sneha Paul, Chuan He, Oded Regev, Jingyi Fei'
  venue: 'Science Advances 10 (42), eadp7727'
  intro: >
    We demonstrate that RNA localization dynamics to nuclear speckles are tied to gene expression by influencing splicing efficiency.
    Specifically, nuclear speckles coordinate both co- and post-transcriptional splicing regulation by facilitating the removal of inefficiently excised introns in transcripts enriched within them.
  links:
    - label: paper
      url: https://www.science.org/doi/full/10.1126/sciadv.adp7727

