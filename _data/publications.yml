- id: thoughttrace
  selected: true
  title: "ThoughtTrace: Understanding User Thoughts in Real-World LLM Interactions"
  authors: '<b>Chuanyang Jin</b>, Binze Li, Haopeng Xie, Cathy Mengying Fang, Tianjian Li, Shayne Longpre, Hongxiang Gu, Maximillian Chen, Tianmin Shu'
  venue: 'ICML 2026 RLxF Workshop <span class="award">Best Paper Award</span> / 📈 30K+ Huggingface Downloads / 🔍 Invited Talk at UW'
  # https://huggingface.co/api/datasets/SCAI-JHU/ThoughtTrace?expand=downloadsAllTime; / 📰 Featured in Synced; ⭐️ Paper of the Week by Huggingface
  intro: >
    We introduce <i>ThoughtTrace</i>, the first large-scale dataset that pairs real-world multi-turn human-AI conversations with users' self-reported thoughts.
    Our experiments show that these thoughts are hard for frontier LLMs to infer, and provide actionable signals for user-behavior prediction and model alignment,
    opening new directions for user modeling, model training, and evaluation.
  links:
