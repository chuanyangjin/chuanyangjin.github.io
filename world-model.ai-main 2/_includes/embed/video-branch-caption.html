{% assign sync_name = include.video1 | replace: ".mp4", "" | replace: "-", "_" | split: "/" | last %}
<div class="w-100 px-1 items-center mb-2 flex flex-col justify-content-end" id="{{ sync_name }}">
  <div class="w-full flex flex-row mb-1 align-items-end justify-content-end flex-wrap row-gap-2">
    <div class="flex flex-col justify-content-end w-50-w w-33">
      <p class="figure-caption text-center m-auto lh-sm w-85 text-wrap-balance"> </p>
      <img muted loop playsinline class="w-100 px-1 do-not-play ratio-8-5" src="{{ include.video1 }}.jpg" alt="">
    </div>
    <div class="flex flex-col justify-content-end w-50-w w-33">
      <p class="figure-caption text-center m-auto lh-sm w-85 text-wrap-balance">Action: {{ include.caption1 }}</p>
      <video muted loop playsinline class="w-100 px-1 ratio-8-5 s1">
        <source src="{{ include.video1 }}" type="video/mp4">
      </video>
    </div>
    <div class="flex flex-col justify-content-end w-50-w w-33">
      <p class="figure-caption text-center m-auto lh-sm w-85 text-wrap-balance">Action: {{ include.caption2 }}</p>
      <video muted loop playsinline class="w-100 px-1 ratio-8-5 s2">
        <source src="{{ include.video2 }}" type="video/mp4">
      </video>
    </div>
    <script>
      var ready_{{ sync_name }}_1 = false;
      var ready_{{ sync_name }}_2 = false;
      var vid_{{ sync_name }}_1 = document.getElementById('{{ sync_name }}').querySelector('.s1');
      var vid_{{ sync_name }}_2 = document.getElementById('{{ sync_name }}').querySelector('.s2');
      function sync_{{ sync_name }} () {
        if (!ready_{{ sync_name }}_1 || !ready_{{ sync_name }}_2) return;
        vid_{{ sync_name }}_1.play();
        vid_{{ sync_name }}_2.play();
      }
      vid_{{ sync_name }}_1.addEventListener('canplaythrough', function() {
        ready_{{ sync_name }}_1 = true;
        sync_{{ sync_name }}();
      });
      vid_{{ sync_name }}_2.addEventListener('canplaythrough', function() {
        ready_{{ sync_name }}_2 = true;
        sync_{{ sync_name }}();
      });
    </script>
  </div>
</div>
