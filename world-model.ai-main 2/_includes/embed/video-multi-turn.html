{% assign captions = include.caption | split: "||" %}
{% assign directory = include.directory | default: "multiturn-gallery" %}
{% if include.sync %}
  {% assign autoplay = "" %}
{% else %}
  {% assign autoplay = "autoplay" %}
{% endif %}

<div class="flex flex-col {{ include.cn }} align-items-end">
  <p class="figure-caption no mb-0 fit-content m-auto px-2" id="multi-turn-caption-{{ include.video }}"></p>
  <div class="flex flex-row w-100 mb-0 px-1" style="gap: 2px">
    <div class="progress-seg" style="width: 40%;">
      <progress id="multi-turn-progress-{{ include.video }}-1" value="0" max="2" class="h-fit-content"></progress>
    </div>
    <div class="progress-seg" style="width: 30%;">
      <progress id="multi-turn-progress-{{ include.video }}-2" value="0" max="1.5"></progress>
    </div>
    <div class="progress-seg" style="width: 30%;">
      <progress id="multi-turn-progress-{{ include.video }}-3" value="0" max="1.5"></progress>
    </div>
  </div>
  <video muted loop {{ autoplay }} playsinline class="w-100 px-1 ratio-8-5" id="multi-turn-video-{{ include.video }}">
    <source src="/assets/world-model/{{ directory }}/{{ include.video }}.mp4" type="video/mp4">
  </video>
  <script>
    var ready_{{ include.video }} = false;
    document.getElementById('multi-turn-video-{{ include.video }}').addEventListener('canplaythrough', function() {
      ready_{{ include.video }} = true;
      {% for v in include.sync %}
        if (!ready_{{ v }}) return;
      {% endfor %}
      {% for v in include.sync %}
        document.getElementById('multi-turn-video-{{ v }}').play();
      {% endfor %}
    });
    function multi_turn_launch_{{ include.video }} () {
      var multi_turn_timeout_{{ include.video }} = 0;
      var video = document.getElementById('multi-turn-video-{{ include.video }}');
      var caption = document.getElementById('multi-turn-caption-{{ include.video }}');
      var text = document.getElementById('multi-turn-caption-{{ include.video }}');
      var progress1 = document.getElementById('multi-turn-progress-{{ include.video }}-1');
      var progress2 = document.getElementById('multi-turn-progress-{{ include.video }}-2');
      var progress3 = document.getElementById('multi-turn-progress-{{ include.video }}-3');
      caption.style.textWrap = 'nowrap';
      caption.style.textOverflow = 'clip';
      setInterval(function () {
        progress1.value = video.currentTime;
        progress2.value = video.currentTime - 2;
        progress3.value = video.currentTime - 3.5;
      }, 100);
      video.addEventListener('timeupdate', function() {
        caption.classList.remove('no');
        progress1.parentElement.classList.remove('l');
        progress2.parentElement.classList.remove('l');
        progress2.parentElement.classList.remove('r');
        caption.style.color = 'transparent';
        if (video.currentTime && video.currentTime < 1.5) {
          caption.innerText = 'Action 1: {{ captions[0] }}';
          caption.style.color = 'black';
          progress1.parentElement.classList.add('l');
        } else if (video.currentTime >= 1.5 && video.currentTime < 1.75) {
          progress2.parentElement.classList.add('l');
        } else if (video.currentTime >= 1.75 && video.currentTime < 3) {
          caption.innerText = 'Action 2: {{ captions[1] }}';
          caption.style.color = 'black';
          progress2.parentElement.classList.add('l');
        } else if (video.currentTime >= 3 && video.currentTime < 3.25) {
          progress2.parentElement.classList.add('r');
        } else if (video.currentTime >= 3.25 && video.currentTime < 4.75) {
          caption.innerText = 'Action 3: {{ captions[2] }}';
          caption.style.color = 'black';
          progress2.parentElement.classList.add('r');
        } else {
          progress2.parentElement.classList.add('r');
        }
      });
    }
    multi_turn_launch_{{ include.video }}();
  </script>
</div>
