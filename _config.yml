# Site configuration for chuanyangjin.com
# Built by GitHub Pages (classic build, github-pages gem / Jekyll 3.x). No custom plugins.
#
# Local preview:
#   bundle install
#   bundle exec jekyll serve          ->  http://localhost:4000
# Production-like build (HTML comments stripped by _layouts/compress.html):
#   JEKYLL_ENV=production bundle exec jekyll build


# Site
# ----------------------------------------------------------------------------------------

title:                 Chuanyang Jin
description:           >
  Chuanyang Jin is a Computer Science PhD student at Johns Hopkins University.
lang:                  en

# With https://, so sitemap.xml, robots.txt, canonical and Open Graph URLs use https.
url:                   https://chuanyangjin.com
baseurl:               ''

# REQUIRED: pages build as /:path/:basename/ (keeps /pandora/, /projects/, ... unchanged).
permalink:             pretty

# Turns off the jekyll-theme-primer theme that GitHub Pages applies when no theme is set.
theme:                 null


# Identity and SEO (jekyll-seo-tag)
# ----------------------------------------------------------------------------------------

logo:                  /assets/img/me-800.jpg

author:
  name:                Chuanyang Jin
  email:               cjin33@jhu.edu
  twitter:             chuanyang_jin

twitter:
  username:            chuanyang_jin
  # Small square card: the large-image default crops the square portrait (me-800.jpg) to 2:1.
  card:                summary

# JSON-LD `sameAs` profiles
social:
  name:                Chuanyang Jin
  links:
    - https://x.com/chuanyang_jin
    - https://github.com/chuanyangjin
    - https://scholar.google.com/citations?user=OZeqpLIAAAAJ
    - https://www.linkedin.com/in/chuanyang-jin

# Google Search Console ownership proof (rendered by jekyll-seo-tag)
google_site_verification: BIY1oUyuFQzBHlJmH_2leWlROwL_Va40ZeggyDz-G5w

favicon:               /assets/icons/favicon-cj.ico
apple_touch_icon:      /assets/icons/icon-512x512-cj.png


# Layout data (used by _includes/header.html, footer.html and hero-aside.html)
# ----------------------------------------------------------------------------------------

nav:
  - title:             Home
    url:               /
  - title:             Publications
    url:               /publication/
  - title:             Life
    url:               /life/

contact:
  email:               cjin33@jhu.edu
  github:              https://github.com/chuanyangjin
  x:                   https://x.com/chuanyang_jin
  scholar:             https://scholar.google.com/citations?user=OZeqpLIAAAAJ&hl=en
  linkedin:            https://www.linkedin.com/in/chuanyang-jin


# Build
# ----------------------------------------------------------------------------------------

# All three are on the GitHub Pages whitelist. Do not add jemoji or jekyll-mentions:
# they rewrite :name: and @name in content (and would change /pandora/).
plugins:
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-sitemap

markdown:              kramdown

# Keep verbatim: pandora.md (Markdown) depends on these options.
kramdown:
  math_engine:         mathjax
  math_engine_opts:    {}
  footnote_backlink:   '&#x21a9;&#xfe0e;'

# Keep verbatim: read by _layouts/compress.html (every page, including /pandora/).
compress_html:
  comments:            ["<!--", "-->"]
  clippings:           all
  endings:             all
  ignore:
    envs:              [development]

# Only matters if an .scss entry point is ever added (the site uses plain assets/css/site.css).
sass:
  style:               compressed

# This list replaces Jekyll's default exclude list, so the defaults are listed again.
# Patterns match from the repository root. Never exclude docs, static, AutoToM or assets.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .jekyll-cache
  - .sass-cache
  - README.md

# Keeps template leftovers (e.g. static/pdfs/sample.pdf, AutoToM/static/cambrian.pdf) out of
# sitemap.xml; the files are still published. Scope paths must not end in "/" (Jekyll 3 would not
# match them). Only sitemap is set here: never add a default `layout:`.
defaults:
  - scope:
      path:            static
    values:
      sitemap:         false
  - scope:
      path:            AutoToM/static
    values:
      sitemap:         false
